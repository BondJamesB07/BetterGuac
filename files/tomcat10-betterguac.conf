# Added by the betterguac package: tell the BetterGuac web application where
# its settings live, and start Tomcat after the database and guacd.
[Unit]
After=mariadb.service betterguac-guacd.service
PartOf=betterguac.target

[Service]
Environment=GUACAMOLE_HOME=/etc/betterguac
# BetterGuac ships Apache Tomcat 10.1.62 (newer than the distribution's
# tomcat10, with its security fixes): run that, with the distribution's
# configuration in /var/lib/tomcat10 (CATALINA_BASE) unchanged.
Environment=CATALINA_HOME=/usr/share/betterguac/tomcat
