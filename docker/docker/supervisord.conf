[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info
minfds=1024

# Order and readiness:
#   mariadb first (priority 10). guacd and tomcat start after it and block in
#   wait-for-db until MariaDB answers on its socket. Supervisor priorities
#   alone are not readiness, hence the wait-for-db wrapper.

[program:mariadb]
command=/usr/local/bin/betterguac-mariadb-run
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=45
stopasgroup=false
killasgroup=true
stdout_logfile=/var/log/supervisor/mariadb.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/mariadb.log
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:guacd]
command=/usr/local/bin/betterguac-wait-for-db /usr/local/bin/betterguac-guacd-run
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/guacd.log
stderr_logfile=/var/log/supervisor/guacd.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:tomcat]
command=/usr/local/bin/betterguac-wait-for-db /usr/local/bin/betterguac-tomcat-run
priority=30
autostart=true
autorestart=true
# catalina.sh run execs java within a second; startsecs only needs to be long
# enough that a crash loop is still caught.
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tomcat.log
stderr_logfile=/var/log/supervisor/tomcat.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface